name: auditpilot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_DATABASE: auditpilot
      MYSQL_USER: auditpilot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uauditpilot -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_NAME: AuditPilot
      API_V1_PREFIX: /api/v1
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      FRONTEND_PUBLIC_URL: ${PUBLIC_ORIGIN}
      CORS_ORIGINS: '["${PUBLIC_ORIGIN}"]'
      DATABASE_URL: mysql+pymysql://auditpilot:${MYSQL_PASSWORD}@mysql:3306/auditpilot?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/backend/data
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@example.com}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      ADMIN_BOOTSTRAP_RESET_PASSWORD: ${ADMIN_BOOTSTRAP_RESET_PASSWORD:-false}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-1000}
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-209715200}
      UPLOAD_MAX_TOTAL_BYTES: ${UPLOAD_MAX_TOTAL_BYTES:-209715200}
      EXTRACTION_MAX_FILES: ${EXTRACTION_MAX_FILES:-10000}
      EXTRACTION_MAX_TOTAL_BYTES: ${EXTRACTION_MAX_TOTAL_BYTES:-524288000}
      USER_STORAGE_QUOTA_BYTES: ${USER_STORAGE_QUOTA_BYTES:-2147483648}
      JAVA_AUDIT_SKILLS_ENABLED: ${JAVA_AUDIT_SKILLS_ENABLED:-false}
      JAVA_AUDIT_SKILLS_ROOT: /opt/auditpilot/skills
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - audit_data:/app/backend/data
      - ${JAVA_AUDIT_SKILLS_HOST_PATH:-./docker/empty-skills}:/opt/auditpilot/skills:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)); assert data['database']=='ok'"
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  audit_data:
