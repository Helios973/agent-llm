    <title>AuditPilot · 管理员操作日志</title>

  </head>
  <body class="admin-page">
    <a class="skip-link" href="#adminApp">跳到主要内容</a>
    <div class="admin-shell">
      <header class="admin-header">
        <a class="brand brand-link" href="./index.html" aria-label="返回 AuditPilot 工作台"><div class="brand-mark" aria-hidden="true">&gt;_</div><div><strong>AuditPilot</strong><p>Administration</p></div></a>
        <div class="admin-header-title">
          <span class="eyebrow">// ADMINISTRATION</span><h1>管理员操作日志<span class="terminal-cursor" aria-hidden="true"></span></h1>
          <nav class="admin-nav" aria-label="管理页面"><a href="./admin.html">用户</a><a href="./admin-tasks.html">任务</a><a class="active" href="./admin-logs.html">操作日志</a></nav>
        </div>
        <div class="admin-header-actions"><span id="adminIdentity" class="chip">-</span><a class="link-button ghost" href="./index.html">返回工作台</a><button id="adminLogoutBtn" class="ghost" type="button">退出登录</button></div>
      </header>

      <main id="adminApp" class="admin-layout" hidden>
        <section class="panel admin-users-panel">
          <div class="panel-header"><div><span class="section-label">Operations</span><h2>操作记录</h2></div><div class="table-actions"><button id="clearSelectedLogsBtn" class="ghost compact" type="button" disabled>清空选中</button><button id="clearAllLogsBtn" class="danger-action compact" type="button">清空全部</button><button id="refreshAuditLogsBtn" class="ghost compact" type="button">刷新日志</button></div></div>
          <p class="helper-text admin-log-hint">勾选后可删除指定记录；日志内容已转换为便于阅读的说明。</p>
          <div id="adminMessage" class="auth-message" role="status" hidden></div>
          <div id="auditLogsTable" class="table-wrap"></div>
        </section>
      </main>

      <section id="adminGate" class="auth-screen"><div class="auth-card compact-card"><div class="brand auth-brand"><div class="brand-mark" aria-hidden="true">&gt;_</div><div><strong>需要管理员权限</strong><p id="adminGateMessage">正在验证登录状态…</p></div></div><a class="link-button primary full-width" href="./index.html">前往登录</a></div></section>
    </div>
    <script src="./assets/runtime-config.js?v=admin-pages-20260723"></script>
    <script type="module" src="./assets/admin-logs.js?v=admin-pages-20260723"></script>
